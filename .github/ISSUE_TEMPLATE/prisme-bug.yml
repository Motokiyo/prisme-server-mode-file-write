name: Prisme Desktop bug report
description: Report a bug encountered in Prisme Desktop
title: "[Bug] "
labels: ["bug", "prisme-desktop"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: Describe the bug you encountered.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or video
      description: Attach a screenshot, screen recording, or paste a link.
      placeholder: Drag and drop a screenshot here, or paste a link.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Prisme version
      description: Open Settings → bottom-left of the dialog to find the version.
      placeholder: e.g. 0.1.5
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: false

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: Specific OS version if relevant.
      placeholder: e.g. macOS 14.4, Ubuntu 22.04, Windows 11
    validations:
      required: false
