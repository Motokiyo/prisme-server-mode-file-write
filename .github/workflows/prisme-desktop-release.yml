name: prisme desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version, for example 1.0.0"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - beta
      publish:
        description: "Publish artifacts to GitHub Releases"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency: prisme-desktop-release-${{ inputs.channel }}-${{ inputs.version }}

jobs:
  prepare-release:
    name: prepare GitHub release
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [ "$CHANNEL" = "beta" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Prisme $TAG" $PRERELEASE_FLAG
          else
            gh release create "$TAG" --title "Prisme $TAG" --notes "Prisme Desktop $TAG" $PRERELEASE_FLAG
          fi

  build:
    name: build ${{ matrix.name }}
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-26
            target: aarch64-apple-darwin
            package_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          - name: mac-x64
            os: macos-26-intel
            target: x86_64-apple-darwin
            package_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package_flag: --win --x64
            bun_install_flags: ""
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_flag: --linux --x64
            bun_install_flags: ""

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.bun_install_flags }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare Apple API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/prisme-apple-api-key.p8", Buffer.from(process.env.APPLE_API_KEY_BASE64, "base64"))'
          fi

      - name: Azure login for Windows signing
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set desktop version
        shell: bash
        env:
          PRISME_VERSION: ${{ inputs.version }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs")
          const path = "packages/desktop/package.json"
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
          pkg.version = process.env.PRISME_VERSION
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n")
          NODE

      - name: Typecheck
        run: bun turbo typecheck --filter=@opencode-ai/desktop --filter=@opencode-ai/app --filter=@opencode-ai/ui --filter=@opencode-ai/core --filter=@opencode-ai/sdk

      - name: Test app
        working-directory: packages/app
        # --conditions=solid : sans cette condition, solid-js resout vers son build
        # serveur et 66 tests ne s'executent meme pas. C'est la condition qu'utilise le
        # script canonique test:unit de packages/app.
        run: bun test --conditions=solid --preload ./happydom.ts ./src

      - name: Build Electron app
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: ${{ inputs.channel }}
          # Les runners macOS ont 7 Go la ou Linux et Windows en ont 16, et le bundling
          # depasse le tas par defaut de Node : "JavaScript heap out of memory", SIGABRT.
          # On releve la limite au lieu de reduire le build.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Package Electron app
        working-directory: packages/desktop
        run: npx electron-builder ${{ matrix.package_flag }} --publish ${{ inputs.publish && 'always' || 'never' }} --config electron-builder.config.ts
        env:
          OPENCODE_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/prisme-apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}

      - name: Notarize macOS DMG containers
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: bun scripts/notarize-dmg.ts
        env:
          APPLE_API_KEY: ${{ runner.temp }}/prisme-apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify Windows signatures
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\*.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - if: ${{ always() && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: prisme-desktop-${{ matrix.name }}
          path: packages/desktop/dist/*
